[project]
name = "cms"
version = "0.1.0"
description = "Pairwise evaluation of content and structure CoT monitors under reasoning rewrites"
readme = "README.md"
authors = [
    { name = "scparkmaths", email = "scpark.maths@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "control-arena>=20.0.1",
    "huggingface-hub>=1.33.0",
    "inspect-ai>=0.3.278",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.28.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
